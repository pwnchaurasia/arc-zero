name: Nightly database backup

# Dumps the hosted Postgres every night, encrypts it, and stores it in DigitalOcean
# Spaces (any S3-compatible storage works). Runs on GitHub, so it keeps working even
# if the droplet is gone.
#
# Encryption uses `age` with a PUBLIC key only. The private key lives in your password
# manager, never in GitHub or on the server, so a leaked token cannot read backups.
# Retention is a bucket lifecycle rule (see readme "Backups"), so this job never
# needs permission to delete anything.
on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same environment as the deploy, so every secret and variable lives in one place:
    # Settings -> Environments -> production.
    environment: production
    steps:
      - name: Check backup settings
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
        run: |
          fail=0
          need() { if [ -z "$2" ]; then echo "::error::Missing $1 in Settings -> Environments -> production"; fail=1; fi; }
          need "secret BACKUP_DATABASE_URL" "$DATABASE_URL"
          need "secret BACKUP_S3_ACCESS_KEY" "$S3_ACCESS_KEY"
          need "secret BACKUP_S3_SECRET_KEY" "$S3_SECRET_KEY"
          need "variable BACKUP_AGE_RECIPIENT" "$AGE_RECIPIENT"
          need "variable BACKUP_S3_BUCKET" "$S3_BUCKET"
          if [ -n "$DATABASE_URL" ]; then
            case "$DATABASE_URL" in
              postgresql+asyncpg://*|*'?ssl='*|*'&ssl='*)
                echo "::error::BACKUP_DATABASE_URL is in the app's format. pg_dump needs postgresql://...?sslmode=require (no '+asyncpg', and 'sslmode' instead of 'ssl')."
                fail=1 ;;
              postgresql://*sslmode=require*|postgresql://*sslmode=verify-ca*|postgresql://*sslmode=verify-full*) ;;
              *)
                echo "::error::BACKUP_DATABASE_URL must look like postgresql://user:pass@host:port/db?sslmode=require"
                fail=1 ;;
            esac
          fi
          if [ -n "$AGE_RECIPIENT" ] && [[ "$AGE_RECIPIENT" != age1* ]]; then
            echo "::error::BACKUP_AGE_RECIPIENT must be an age public key (starts with age1). Never the private key."
            fail=1
          fi
          exit $fail

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Dump and encrypt
        env:
          # libpq form, e.g. postgresql://user:pass@host:port/arc_zero?sslmode=require
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          PG_IMAGE: ${{ vars.BACKUP_PG_IMAGE || 'postgres:17-alpine' }}
        run: |
          set -euo pipefail
          file="arc-zero-$(date -u +%Y-%m-%dT%H%MZ).dump.age"
          # pg_dump runs in a container so its version can match the server (BACKUP_PG_IMAGE).
          # Only the app's `public` schema: hosted Postgres (e.g. Supabase) has its own
          # schemas that the app's user cannot read, which would make a full dump fail.
          docker run --rm -e DATABASE_URL "$PG_IMAGE" \
              sh -c 'exec pg_dump --format=custom --no-owner --no-privileges --schema=public "$DATABASE_URL"' \
            | age --encrypt --recipient "$AGE_RECIPIENT" > "$file"
          size=$(stat -c %s "$file")
          if [ "$size" -lt 1024 ]; then
            echo "::error::Backup is suspiciously small ($size bytes)"; exit 1
          fi
          echo "FILE=$file" >> "$GITHUB_ENV"
          echo "Backup $file: $size bytes"

      - name: Upload to Spaces
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1 # required by the CLI; Spaces ignores it
          # AWS CLI 2.23+ sends new checksum headers that S3-compatible stores such as
          # Spaces can reject; only send them when the operation requires it.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT || 'https://blr1.digitaloceanspaces.com' }}
          BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
        run: |
          aws s3 cp "$FILE" "s3://$BUCKET/arc-zero/$FILE" --endpoint-url "$ENDPOINT" --no-progress
