name: CI

# Tests run once per change: on its pull request. `main` only accepts merges whose
# checks passed (branch protection), and releases deploy only commits already on
# `main`, so re-running the suite after merging or when releasing would test the
# same code again.
#
# Speed: each Rust artifact (browser WASM, Python engine wheel, level generator) is
# built once, by its own job, in parallel; the test jobs download it instead of
# compiling Rust again. Everything else runs side by side.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Not a secret: CI levels only. Production uses ARC_LEVEL_SEED from GitHub secrets.
  CI_LEVEL_SEED: ci-only-seed-not-secret-0123456789abcdef

jobs:
  # ------------------------------------------------------------ build once

  wasm:
    name: Build browser engine (WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # A prebuilt binary: compiling wasm-pack from source took minutes on every run.
      - uses: taiki-e/install-action@v2
        with: { tool: wasm-pack@0.13.1 }
      - run: npm run wasm
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        with: { name: wasm-pkg, path: apps/web/src/wasm/pkg, retention-days: 1 }

  wheel:
    name: Build server engine (Python wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      # abi3 wheel: works on every CPython >= 3.12, so one build serves every job.
      - run: uv build --wheel crates/arc-engine-py --out-dir dist
      - uses: actions/upload-artifact@v4
        with: { name: engine-wheel, path: dist/*.whl, retention-days: 1 }

  levelgen:
    name: Build level generator and CI levels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p arc-levelgen
      # e2e only plays the first levels: 10 per game take seconds. The full 100 are
      # checked for speed in `levels`, alongside everything else.
      - name: Generate the e2e levels
        run: .github/scripts/ci-levelgen.sh "$CI_LEVEL_SEED" levels --levels 10
      - uses: actions/upload-artifact@v4
        with: { name: levelgen, path: target/release/arc-levelgen, retention-days: 1 }
      - uses: actions/upload-artifact@v4
        with: { name: ci-levels, path: levels, retention-days: 1 }

  # ----------------------------------------------------------------- checks

  engine:
    name: Rust engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  levels:
    name: All levels generate quickly (${{ matrix.seed }} seed)
    needs: levelgen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: [ci, second, random]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: levelgen, path: target/release }
      - run: chmod +x target/release/arc-levelgen
      # Every release regenerates the levels from its secret seed, so generation must be
      # fast for ANY seed: three seeds side by side, each capped at 10 minutes on this
      # 4-core runner (the deploy job has 30 minutes in total).
      - name: Generate all 100 levels per game (max 10 min)
        run: |
          case "${{ matrix.seed }}" in
            ci) seed=$CI_LEVEL_SEED ;;
            second) seed=ci-only-second-seed-not-secret-0123456789ab ;;
            *) seed=$(openssl rand -hex 32) ;;
          esac
          .github/scripts/ci-levelgen.sh "$seed" /tmp/levels

  api:
    name: API
    needs: wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: arc, POSTGRES_PASSWORD: arc, POSTGRES_DB: arc }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U arc" --health-interval 2s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 20
    defaults:
      run: { working-directory: apps/api }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with: { name: engine-wheel, path: dist }
      # Everything from the lock file except the engine, which comes from the wheel.
      # `--no-sync` below keeps uv from building the engine from source again.
      - run: uv sync --frozen --no-install-package arc-engine && uv pip install ../../dist/*.whl
      - run: uv run --no-sync ruff check . && uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy src tests
      - run: uv run --no-sync pytest -q

  web:
    name: Web
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: apps/web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: wasm-pkg, path: apps/web/src/wasm/pkg }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: apps/web/package.json, version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm determinism
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end ${{ matrix.shard }}/2 (production build, strict CSP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only the build jobs: e2e runs alongside the lint and unit-test jobs.
    needs: [wasm, wheel, levelgen]
    # The tests are split across two runners; each runs its half one test at a time, so
    # the software-rendered canvases never compete for one runner's CPU.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: arc, POSTGRES_PASSWORD: arc, POSTGRES_DB: arc }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U arc" --health-interval 2s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 20
    env:
      ARC_ENV: development
      ARC_DATABASE_URL: postgresql+asyncpg://arc:arc@localhost:55432/arc
      ARC_REDIS_URL: redis://localhost:56379/0
      ARC_LEVELS_PATH: /tmp/levels
      ARC_SIGNING_KEYS: '{"k1": "ci-only-signing-key-not-secret-0123456789abcdef"}'
      ARC_RECOVERY_PEPPER: ci-only-pepper-not-secret-0123456789abcdef
      ARC_ALLOWED_ORIGINS: '["http://127.0.0.1:4173"]'
      ARC_ALLOWED_HOSTS: '["localhost","127.0.0.1"]'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with: { package_json_file: apps/web/package.json, version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - uses: actions/download-artifact@v4
        with: { name: engine-wheel, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: wasm-pkg, path: apps/web/src/wasm/pkg }
      - uses: actions/download-artifact@v4
        with: { name: ci-levels, path: /tmp/levels }
      - name: Start API
        working-directory: apps/api
        run: |
          uv sync --frozen --no-install-package arc-engine
          uv pip install ../../dist/*.whl
          uv run --no-sync alembic upgrade head
          nohup uv run --no-sync uvicorn --factory arc_api.main:app --host 127.0.0.1 --port 8000 \
            --no-access-log > "$RUNNER_TEMP/api.log" 2>&1 < /dev/null &
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
      - name: Build web and start preview
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install --with-deps chromium
          # Pin IPv4: on the runner `localhost` may resolve to ::1 for one tool and
          # 127.0.0.1 for another, so a waiter can knock on the wrong door forever.
          nohup pnpm preview --host 127.0.0.1 > "$RUNNER_TEMP/preview.log" 2>&1 < /dev/null &
      - name: Wait for both servers (max 2 min)
        run: npx --yes wait-on --timeout 120000 http-get://127.0.0.1:4173 http-get://127.0.0.1:8000/api/v1/ready
      - name: Run e2e
        working-directory: apps/web
        timeout-minutes: 10
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: pnpm e2e --shard=${{ matrix.shard }}/2
      - name: Server logs
        if: failure()
        run: |
          echo "::group::api.log"; cat "$RUNNER_TEMP/api.log" || true; echo "::endgroup::"
          echo "::group::preview.log"; cat "$RUNNER_TEMP/preview.log" || true; echo "::endgroup::"
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: "playwright-traces-${{ matrix.shard }}", path: apps/web/test-results }

  # The single check that `main` requires (see .github/rulesets/main.json). It passes
  # only if every job above succeeded, so adding or renaming a job can never silently
  # remove it from the merge requirement.
  gate:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [wasm, wheel, levelgen, engine, levels, api, web, e2e]
    if: always()
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::Not every CI job succeeded; merging into main is blocked."
              exit 1
            fi
          done
