name: Release

# Creating (or pushing to) a branch named release/YY.MM.XX deploys it to production:
#   git switch -c release/26.10.01 && git push -u origin release/26.10.01
# YY = year, MM = month, XX = release number within that month.
on:
  push:
    branches: ["release/**"]

permissions:
  contents: read

# One deploy at a time; never cancel a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  version:
    name: Check release name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ ! "$BRANCH" =~ ^release/([0-9]{2})\.(0[1-9]|1[0-2])\.([0-9]{2})$ ]]; then
            echo "::error::Release branches must be named release/YY.MM.XX (e.g. release/26.10.01), got '$BRANCH'"
            exit 1
          fi
          echo "version=${BRANCH#release/}" >> "$GITHUB_OUTPUT"

  checks:
    name: Full CI
    needs: version
    uses: ./.github/workflows/ci.yml

  images:
    name: Build ${{ matrix.service }} image
    needs: [version, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/arc-zero-${{ matrix.service }}:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/arc-zero-${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to production
    needs: [version, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://${{ vars.SITE_ADDRESS }}
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/arc-zero' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check production secrets are set
        env:
          ARC_DATABASE_URL: ${{ secrets.ARC_DATABASE_URL }}
          ARC_SIGNING_KEYS: ${{ secrets.ARC_SIGNING_KEYS }}
          ARC_RECOVERY_PEPPER: ${{ secrets.ARC_RECOVERY_PEPPER }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          ARC_LEVEL_SEED: ${{ secrets.ARC_LEVEL_SEED }}
        run: |
          missing=0
          for name in ARC_DATABASE_URL ARC_SIGNING_KEYS ARC_RECOVERY_PEPPER REDIS_PASSWORD ARC_LEVEL_SEED; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name in the production environment"; missing=1; fi
          done
          case "$ARC_DATABASE_URL" in
            postgresql+asyncpg://*'?ssl='require*|postgresql+asyncpg://*'?ssl=verify-'*) ;;
            *) echo "::error::ARC_DATABASE_URL must look like postgresql+asyncpg://…?ssl=require"; missing=1 ;;
          esac
          [[ "$REDIS_PASSWORD" =~ ^[A-Za-z0-9]+$ ]] || { echo "::error::REDIS_PASSWORD must be letters and digits only"; missing=1; }
          exit $missing

      # Levels are regenerated from the secret seed on every deploy: the same seed (and
      # generator code) always produces the same levels. The output never leaves this job
      # except over SSH to the server.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Generate levels
        env:
          ARC_LEVEL_SEED: ${{ secrets.ARC_LEVEL_SEED }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/secrets"
          cargo run --release -p arc-levelgen -- --out "$RUNNER_TEMP/secrets/levels.json"

      - name: Write server config
        env:
          ARC_DATABASE_URL: ${{ secrets.ARC_DATABASE_URL }}
          ARC_SIGNING_KEYS: ${{ secrets.ARC_SIGNING_KEYS }}
          ARC_SIGNING_KID: ${{ vars.ARC_SIGNING_KID || 'k1' }}
          ARC_RECOVERY_PEPPER: ${{ secrets.ARC_RECOVERY_PEPPER }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          SITE: ${{ vars.SITE_ADDRESS }}
        run: |
          umask 077
          cd "$RUNNER_TEMP/secrets"
          printf '%s' "$REDIS_PASSWORD" > redis_password
          {
            echo "ARC_ENV=production"
            echo "ARC_DATABASE_URL=$ARC_DATABASE_URL"
            echo "ARC_REDIS_URL=redis://:$REDIS_PASSWORD@redis:6379/0"
            echo "ARC_SIGNING_KEYS=$ARC_SIGNING_KEYS"
            echo "ARC_SIGNING_KID=$ARC_SIGNING_KID"
            echo "ARC_RECOVERY_PEPPER=$ARC_RECOVERY_PEPPER"
            echo "ARC_ALLOWED_ORIGINS=[\"https://$SITE\"]"
            echo "ARC_ALLOWED_HOSTS=[\"$SITE\",\"127.0.0.1\"]"
            echo "ARC_COOKIE_SECURE=true"
            echo "ARC_HSTS=true"
            echo "ARC_EXPOSE_DOCS=false"
          } > api.env

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Pinned host key: never trust-on-first-use from CI.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            Port ${{ vars.DEPLOY_PORT || 22 }}
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Upload compose file and secrets
        run: |
          ssh prod "set -e; umask 077; mkdir -p '$DEPLOY_DIR/secrets.new'"
          scp -q "$RUNNER_TEMP"/secrets/api.env "$RUNNER_TEMP"/secrets/redis_password \
              "$RUNNER_TEMP"/secrets/levels.json prod:"$DEPLOY_DIR/secrets.new/"
          scp -q infra/docker-compose.release.yml prod:"$DEPLOY_DIR/docker-compose.yml"
          # Swap the whole directory at once, so a half-copied set is never used.
          ssh prod "set -e; cd '$DEPLOY_DIR'; chmod 600 secrets.new/*
            rm -rf secrets.old; [ -d secrets ] && mv secrets secrets.old; mv secrets.new secrets; rm -rf secrets.old"
          rm -rf "$RUNNER_TEMP/secrets"

      - name: Pull and start the release
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # The job's short-lived token is used to pull, then the server logs out:
          # no long-lived registry credential is stored on the server.
          printf '%s' "$GHCR_TOKEN" | ssh prod "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          # The live version is recorded in .env, so manual `docker compose` commands
          # (and rollbacks: edit IMAGE_TAG, then `docker compose up -d`) need no flags.
          ssh prod "set -e
            cd '$DEPLOY_DIR'
            touch .env
            sed -i '/^IMAGE_PREFIX=/d;/^IMAGE_TAG=/d' .env
            printf 'IMAGE_PREFIX=ghcr.io/%s\nIMAGE_TAG=%s\n' '$OWNER' '$VERSION' >> .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f"

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${{ vars.SITE_ADDRESS }}/api/v1/ready"; then
              echo; echo "Release $VERSION is live"; exit 0
            fi
            sleep 5
          done
          echo "::error::Release $VERSION did not become healthy"
          ssh prod "cd '$DEPLOY_DIR' && docker compose ps && docker compose logs --tail 80 api"
          exit 1
