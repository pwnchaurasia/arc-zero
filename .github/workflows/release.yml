name: Release

# Creating (or pushing to) a branch named release/YY.MM.XX deploys it to production:
#   git switch -c release/26.10.01 && git push -u origin release/26.10.01
# YY = year, MM = month, XX = release number within that month.
on:
  push:
    branches: ["release/**"]

permissions:
  contents: read

# One deploy at a time; never cancel a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  version:
    name: Check release name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ ! "$BRANCH" =~ ^release/([0-9]{2})\.(0[1-9]|1[0-2])\.([0-9]{2})$ ]]; then
            echo "::error::Release branches must be named release/YY.MM.XX (e.g. release/26.10.01), got '$BRANCH'"
            exit 1
          fi
          echo "version=${BRANCH#release/}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The tests already ran on the pull request that brought this code into `main`.
      # Releasing is only allowed for commits on `main`, so untested code (e.g. a commit
      # pushed straight to a release branch) can never reach production.
      - name: Release commit must already be on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main. Merge changes through a pull request (where the tests run), then cut the release branch from main."
            exit 1
          fi
          echo "$GITHUB_SHA is on main: it passed CI on its pull request."

  images:
    name: Build ${{ matrix.service }} image
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/arc-zero-${{ matrix.service }}:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/arc-zero-${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to production
    needs: [version, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://${{ vars.SITE_ADDRESS }}
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/arc-zero' }}
    steps:
      - uses: actions/checkout@v4

      # Validates every secret first, so a missing one fails in seconds, not after builds.
      - name: Write server config
        env:
          ARC_DATABASE_URL: ${{ secrets.ARC_DATABASE_URL }}
          ARC_SIGNING_KEYS: ${{ secrets.ARC_SIGNING_KEYS }}
          ARC_SIGNING_KID: ${{ vars.ARC_SIGNING_KID }}
          ARC_RECOVERY_PEPPER: ${{ secrets.ARC_RECOVERY_PEPPER }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
        run: infra/deploy/write-config.sh "$RUNNER_TEMP/secrets"

      # Levels are regenerated from the secret seed on every deploy: the same seed (and
      # generator code) always produces the same levels. They only leave this job over SSH.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Generate levels
        env:
          ARC_LEVEL_SEED: ${{ secrets.ARC_LEVEL_SEED }}
        run: |
          if [ -z "$ARC_LEVEL_SEED" ]; then echo "::error::Missing secret ARC_LEVEL_SEED"; exit 1; fi
          umask 077
          cargo run --release -p arc-levelgen -- --out "$RUNNER_TEMP/secrets/levels.json"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ vars.DEPLOY_PORT || 22 }}
        run: |
          for v in SSH_KEY KNOWN_HOSTS HOST USER_NAME; do
            if [ -z "${!v}" ]; then echo "::error::Missing deploy secret for $v"; exit 1; fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Pinned host key: never trust-on-first-use from CI.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' \
            "$HOST" "$USER_NAME" "$PORT" > ~/.ssh/config
          ssh prod true

      - name: Upload release files
        run: |
          ssh prod "mkdir -p '$DEPLOY_DIR/secrets.new'"
          scp -q "$RUNNER_TEMP"/secrets/api.env "$RUNNER_TEMP"/secrets/redis_password \
              "$RUNNER_TEMP"/secrets/levels.json prod:"$DEPLOY_DIR/secrets.new/"
          scp -q infra/docker-compose.release.yml prod:"$DEPLOY_DIR/docker-compose.yml"
          scp -q infra/deploy/activate.sh prod:"$DEPLOY_DIR/activate.sh"
          rm -rf "$RUNNER_TEMP/secrets"

      - name: Start the release
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # The job's short-lived token is used to pull, then the server logs out:
          # no long-lived registry credential is stored on the server.
          printf '%s' "$GHCR_TOKEN" | ssh prod "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          status=0
          ssh prod "bash '$DEPLOY_DIR/activate.sh' '$DEPLOY_DIR' 'ghcr.io/$OWNER' '$VERSION'" || status=$?
          ssh prod "docker logout ghcr.io" || true
          exit $status

      - name: Health check through nginx
        env:
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
        run: |
          for i in $(seq 1 24); do
            if curl -fsS --max-time 5 "https://$SITE_ADDRESS/api/v1/ready"; then
              echo; echo "Release $VERSION is live at https://$SITE_ADDRESS"; exit 0
            fi
            sleep 5
          done
          echo "::error::https://$SITE_ADDRESS/api/v1/ready did not answer: check DNS, the nginx site and the certificate"
          exit 1
