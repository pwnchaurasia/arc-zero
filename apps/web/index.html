<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1020" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Ad-free games. No ads, no tracking." />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Named by the server for the address the app is opened on (api: /manifest.webmanifest).
         use-credentials: browsers fetch the manifest without cookies by default, and a
         tunnel's "you are about to visit" page (ngrok's free plan) would then answer in its
         place, so the app wouldn't be installable there. -->
    <link rel="manifest" href="/api/v1/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Games</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>The games need JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
