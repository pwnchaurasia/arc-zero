# Local development services only. Ports are bound to localhost and offset
# from the defaults so they never collide with a host Postgres/Redis.
name: arc-zero-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc
      POSTGRES_DB: arc
    ports: ["127.0.0.1:55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arc"]
      interval: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20
volumes:
  pgdata:
