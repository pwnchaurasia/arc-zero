# Production stack (image-based). The release workflow copies this file to the
# server as docker-compose.yml and records IMAGE_PREFIX / IMAGE_TAG in .env.
# TLS: host nginx (infra/nginx/). Postgres: external, hosted (ARC_DATABASE_URL,
# encrypted connection required). Secrets live next to it in ./secrets/.
name: arc-zero
services:
  web:
    image: ${IMAGE_PREFIX:?}/arc-zero-web:${IMAGE_TAG:?}
    restart: unless-stopped
    # Only the host's nginx can reach this; it is never exposed publicly.
    ports: ["127.0.0.1:8080:80"]
    depends_on: { api: { condition: service_healthy } }
    networks: [edge, internal]
    read_only: true
    tmpfs: [/data, /config, /tmp]
    security_opt: ["no-new-privileges:true"]

  api:
    image: ${IMAGE_PREFIX:?}/arc-zero-api:${IMAGE_TAG:?}
    restart: unless-stopped
    env_file: [secrets/api.env]
    secrets: [levels.json]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [internal, egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  migrate:
    image: ${IMAGE_PREFIX:?}/arc-zero-api:${IMAGE_TAG:?}
    command: ["alembic", "upgrade", "head"]
    env_file: [secrets/api.env]
    networks: [internal, egress]
    restart: "no"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sessions live here, so persist them (AOF) across restarts.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets: [redis_password]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning ping"]
      interval: 5s
      retries: 20
    networks: [internal]

secrets:
  levels.json: { file: ./secrets/levels.json }
  redis_password: { file: ./secrets/redis_password }

volumes: { redisdata: {} }

networks:
  edge: {}
  egress: {}
  internal: { internal: true }
