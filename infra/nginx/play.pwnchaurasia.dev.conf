# Host nginx site for the game. Install as /etc/nginx/sites-available/play.pwnchaurasia.dev
# and symlink into sites-enabled. Get the certificate first (see readme "Server setup").
# The app container listens on 127.0.0.1:8080 only; nginx is the sole public entry.

server {
    listen 80;
    listen [::]:80;
    server_name play.pwnchaurasia.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` works on every nginx version; the newer `http2 on;` needs 1.25.1+
    # (Ubuntu 24.04 ships 1.24). On 1.25.1+ this only prints a deprecation warning.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name play.pwnchaurasia.dev;

    ssl_certificate     /etc/letsencrypt/live/play.pwnchaurasia.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.pwnchaurasia.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:arc_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 64k;   # the API rejects anything over 32 KB anyway
    access_log off;             # no player IP addresses in logs

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (never append): a client cannot inject a fake IP to dodge rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
